<ion-header><ion-toolbar><ion-title>Cửa hàng NPC</ion-title></ion-toolbar></ion-header>
<ion-content><main class="shell"><p class="eyebrow">TIỆM ĐÈN BÊN NGÕ</p><h1>Mua vật phẩm</h1>@if (save; as current) {<p class="wallet">Vàng <strong>{{ current.profile.gold }}</strong> · Túi {{ current.inventory.length }} / 60</p>}<div class="catalogue">@for (item of catalogue; track item.id) {<ion-card><ion-card-header><ion-card-title>{{ item.name }} <small>{{ rarityText(item.rarity) }}</small></ion-card-title></ion-card-header><ion-card-content><p>{{ item.description }}</p><ion-button expand="block" (click)="buy(item)">{{ item.price }} vàng · Mua</ion-button></ion-card-content></ion-card>}</div></main></ion-content>
