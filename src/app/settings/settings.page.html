<ion-header><ion-toolbar><ion-title>Cài đặt</ion-title></ion-toolbar></ion-header><ion-content><main class="shell"><p class="eyebrow">OFFLINE · ÂM THANH & HIỂN THỊ</p><h1>Cài đặt</h1>@if (save; as current) {<ion-list><ion-item><ion-label>Nhạc nền</ion-label><ion-toggle [checked]="current.settings.music" (ionChange)="toggle('music', $event.detail.checked)"></ion-toggle></ion-item><ion-item><ion-label>Hiệu ứng âm thanh</ion-label><ion-toggle [checked]="current.settings.sfx" (ionChange)="toggle('sfx', $event.detail.checked)"></ion-toggle></ion-item><ion-item><ion-label>Giảm chuyển động<br><small>Giữ UI dễ đọc khi cần</small></ion-label><ion-toggle [checked]="current.settings.reducedMotion" (ionChange)="toggle('reducedMotion', $event.detail.checked)"></ion-toggle></ion-item></ion-list>}</main></ion-content>
