<ion-content class="hunt-content" [fullscreen]="true" [scrollY]="false">
  <div class="hunt-shell">
    <button type="button" class="home-back" (click)="goHome()" aria-label="Về nhà">← Về nhà</button>
    <div #gameHost class="game-host" aria-label="Bản đồ chọn mục tiêu"></div>
    @if (isLoading) {
      <div class="loading-state" role="status" aria-live="polite">
        <ion-spinner name="crescent"></ion-spinner>
        <h1>Đang mở bản đồ...</h1>
        <p>Đang tải các khu vực săn quái.</p>
      </div>
    } @else if (loadError) {
      <div class="loading-state" role="alert">
        <h1>Không mở được bản đồ</h1>
        <p>Vui lòng thử lại màn chọn mục tiêu.</p>
      </div>
    } @else {
      <p class="map-hint">Chạm nhanh để vào trận · Ấn giữ để xem thông tin quái. Các khu vực chưa có quái sẽ mở rộng sau.</p>
    }
  </div>
</ion-content>
