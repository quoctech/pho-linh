<ion-content [fullscreen]="true" [scrollY]="false">
  <div #gameHost class="game-host" aria-label="Bàn chơi Match-3 Phố Linh"></div>
  @if (isLoading) {
    <div class="battle-loading" role="status" aria-live="polite">
      <ion-spinner name="crescent"></ion-spinner>
      <h1>Đang mở bàn ngọc...</h1>
      <p>Đang chuẩn bị trận đấu và tải khu săn.</p>
    </div>
  }
</ion-content>
